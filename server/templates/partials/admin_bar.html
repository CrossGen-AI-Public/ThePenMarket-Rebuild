{% if let Some(admin) = page.admin %}
{% if admin.preview %}
<form class="adm-pill" method="post" action="/admin/preview/">
  <input type="hidden" name="csrf" value="{{ page.admin_csrf }}"><input type="hidden" name="on" value="0"><input type="hidden" name="back" value="{{ page.current_path }}">
  <span>Preview: this is what a customer sees. <b>You're still signed in.</b></span>
  <button type="submit">Back to editing</button>
</form>
{% else %}
<div class="adm-bar" id="admBar" data-csrf="{{ page.admin_csrf }}">
  <b>Editing as {{ admin.name }}</b>
  <span class="adm-note">Every change is saved and logged</span>
  <span class="adm-sp"></span>
  <button type="button" class="adm-btn adm-red" id="admAddPen">+ Add a pen</button>
  <form method="post" action="/admin/preview/"><input type="hidden" name="csrf" value="{{ page.admin_csrf }}"><input type="hidden" name="on" value="1"><input type="hidden" name="back" value="{{ page.current_path }}"><button type="submit" class="adm-btn">Preview as customer</button></form>
  <a class="adm-btn" href="/admin/history/">History</a>
  <a class="adm-btn" href="/admin/devices/">Devices</a>
  <a class="adm-btn" href="/admin/password/">Password</a>
  <form method="post" action="/admin/logout/"><input type="hidden" name="csrf" value="{{ page.admin_csrf }}"><button type="submit" class="adm-btn">Sign out</button></form>
</div>
{% endif %}
{% endif %}
