<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.canonical }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="ThePenMarket.com">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.canonical }}">
<meta property="og:image" content="{{ page.og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1C222C">
<link rel="icon" href="/static/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/css/site.css">
{% if !page.jsonld.is_empty() %}<script type="application/ld+json">{{ page.jsonld|safe }}</script>{% endif %}
{% block head %}{% endblock %}
</head>
<body class="section-{{ page.section }}">
<a class="skip" href="#main">Skip to content</a>
{% include "partials/header.html" %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<script src="/static/js/site.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
